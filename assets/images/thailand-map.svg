        <path d="M0 0C-8-10-9-14-9-18a9 9 0 1 1 18 0c0 4-1 8-9 18z" fill="#c0392b" stroke="#fff" stroke-width="1.6" />
        <text class="pin-number" y="-14.1" text-anchor="middle" font-size="11.5" font-weight="900" fill="#fff">1</text>
      </g>
    </g>
    <g class="lbl" transform="translate(868 494) rotate(-1.5)">
      <rect x="-77" y="-23" width="153" height="46" rx="9" fill="#f7ecd0" stroke="#d6c291" stroke-width="2" />
      <text y="10" text-anchor="middle" font-size="30" font-weight="900" fill="#2f2a1d">Bangkok</text>
    </g>
  </g>
