<?xml version='1.0' encoding='utf-8'?>
<svg viewBox="0 0 1024 1536" role="group" aria-label="Mappa illustrata dell’itinerario in Thailandia" xmlns="http://www.w3.org/2000/svg" width="1024" height="1536">
  <style>@import url("https://fonts.googleapis.com/css2?family=Simonetta:ital,wght@0,400;0,900;1,400;1,900&amp;display=swap");
text { font-family: "Simonetta", Georgia, serif; }
.pin-number { font-family: Georgia, serif; }
.stop { cursor: pointer; outline: none; }
.stop .hit { fill: #fff; fill-opacity: 0; transition: fill-opacity .2s; }
.stop:hover .hit, .stop:focus-visible .hit { fill-opacity: .14; }
.stop:focus-visible .hit { stroke: #3f6aa3; stroke-width: 4; }
.stop .pin-in { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .2s; filter: drop-shadow(0 3px 3px rgba(40, 30, 10, .38)); }
.stop:hover .pin-in, .stop:focus-visible .pin-in { transform: scale(1.14); }
.stop .lbl { filter: drop-shadow(0 2px 3px rgba(40, 30, 10, .25)); }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
</style>
  <image href="thailand-map.webp" width="1024" height="1536" />
  <g class="stop" data-set="bkk" tabindex="0" role="button" aria-label="Bangkok: apri le foto della tappa">
